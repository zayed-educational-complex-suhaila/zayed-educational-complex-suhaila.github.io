/* ---------- platform additions (multi-subject) ---------- */
#loadScreen{background:#eef0f2;display:flex!important;align-items:center;justify-content:center;flex-direction:column;gap:14px;color:#34495a;font-weight:700}
#loadScreen:not(.on){display:none!important}
.spin{width:44px;height:44px;border:4px solid #cfd8df;border-top-color:#24475b;border-radius:50%;animation:spn 1s linear infinite}@keyframes spn{to{transform:rotate(360deg)}}
#loadScreen .lerr{max-width:460px;text-align:center;font-weight:600;color:#a8253a}
#loadScreen .lbtn{background:#24475b;color:#fff;border:0;padding:9px 18px;border-radius:4px;font-weight:700}
.prev-banner{background:#f59e0b;color:#1f2937;text-align:center;font-size:12px;font-weight:800;padding:3px 8px;flex:none;letter-spacing:.3px}

.part-badge{display:inline-flex;align-items:center;gap:6px;background:var(--circle);color:#fff;font-size:12px;font-weight:800;padding:3px 12px;border-radius:14px;margin-bottom:12px;letter-spacing:.2px}

body.dark .qgroup{background:#0b1720}
.stem-ar,.ar-text{font-family:'Noto Naskh Arabic','Amiri',Tahoma,Arial;font-weight:700}
.stem.ar-only .stem-ar{border-top:0;margin-top:0;padding-top:0;font-size:calc(var(--stem) * 1.12);line-height:calc(var(--lh) + .35)}
/* bilingual question & answers: English on the left, Arabic on the right (like the official paper); stacked on phones */
.stem.bi{display:grid;grid-template-columns:1fr 1fr;column-gap:32px;direction:ltr;align-items:start}
.stem.bi .stem-ar{border-top:0;margin-top:0;padding-top:0}
.stem.bi > :not(.stem-en):not(.stem-ar){grid-column:1/-1}
.ot .o-bi{display:flex;flex-direction:column;gap:4px;direction:ltr;text-align:left}   /* answer: Arabic line on top, English line under it */
.ot .o-bi .o-ar{margin-top:0;text-align:left}
@media(max-width:700px){.stem.bi{grid-template-columns:1fr}.stem.bi .stem-ar{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}}
.opts.rtl{direction:rtl}.opts.rtl .opt{font-family:'Noto Naskh Arabic','Amiri',Tahoma,Arial;font-size:calc(var(--opt) * 1.12)}
.opts.rtl .opt.struck::before{left:0;right:0}
.q-img{display:block;max-width:min(100%,560px);max-height:420px;margin:14px auto 4px;border:1px solid var(--line);border-radius:4px;background:#fff;object-fit:contain}
body.magnify .stem img.q-img{transform:none;max-width:100%;max-height:none;width:min(100%,820px)}
#passage .p-title{font-weight:800;color:var(--ink);font-size:16px;margin-bottom:10px;padding-bottom:8px;border-bottom:2px solid var(--row-b)}

#passage .p-ar+.p-en,#passage .p-en+.p-ar{margin-top:14px;padding-top:12px;border-top:1px dashed var(--row-b)}
.gap{display:inline-block;min-width:64px;border-bottom:2px solid var(--ink);font-weight:800;padding:0 4px;text-align:center}
.gap.cur{background:#fff176;color:#000;border-radius:3px}
.res-top .rbtn{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.4);border-radius:4px;color:#fff;padding:6px 12px;font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.res-top .rbtn svg{width:16px;height:16px}

.save-state button{margin-inline-start:10px;border:0;background:#a8253a;color:#fff;border-radius:3px;padding:3px 10px;font-weight:700}

.ot .o-en,.ot .o-ar{display:block}.ot .o-ar{font-family:"Noto Naskh Arabic","Segoe UI",Tahoma,sans-serif;text-align:right;margin-top:3px}

[dir=rtl] .res-top .rbtn svg.flip{transform:scaleX(-1)}
/* RTL: mirror the floating buttons so they sit beside the marks bar, not on top of the passage */

<section id="loadScreen" class="screen on"><div class="spin"></div><div id="loadMsg">Loading exam…</div></section>

<!--@HTML_EXAM@-->

<script>
// ============================================================================
//  Runtime exam data — loaded from the platform API (no hard-coded questions)
// ============================================================================
let C = {}, SOURCE_QUESTIONS = [], EXAM = null, ME = null;
const PARAMS = new URLSearchParams(location.search);
let PREVIEW = PARAMS.get('preview') === '1';

/*@JS_T@*/
Object.assign(T.en,{saving:"Saving and scoring your attempt…",questions:"questions",i_term:"Term",i_track:"Track",i_section:"Section",i_id:"Student ID",preview_banner:"PREVIEW MODE — this attempt will NOT be saved",
 r_parts:"Performance by part",try_again:"Try Again",back_exams:"Back to My Exams",back_portal:"Back to Portal",logout:"Logout",saved_ok:"Your attempt was saved (attempt #{n}).",save_err:"Your attempt could not be saved: {m}",retry:"Retry",
 preview_nosave:"Preview mode: results are not saved.",load_err:"This exam could not be loaded.",go_back:"Go back",signin_needed:"Please sign in first.",general:"General",advanced:"Advanced",all:"All",
 Mathematics:"Mathematics",Science:"Science",English:"English",Arabic:"Arabic","Islamic Education":"Islamic Education","Social Studies":"Social Studies",Physics:"Physics",Chemistry:"Chemistry",Biology:"Biology","Computer Science":"Computer Science",Other:"Other"});
Object.assign(T.ar,{saving:"جارٍ حفظ محاولتك وتصحيحها…",questions:"أسئلة",i_term:"الفصل الدراسي",i_track:"المسار",i_section:"الشعبة",i_id:"رقم الطالب",preview_banner:"وضع المعاينة — لن يتم حفظ هذه المحاولة",
 r_parts:"الأداء حسب الجزء",try_again:"حاول مجدداً",back_exams:"العودة إلى اختباراتي",back_portal:"العودة إلى البوابة",logout:"تسجيل الخروج",saved_ok:"تم حفظ محاولتك (المحاولة رقم {n}).",save_err:"تعذر حفظ محاولتك: {m}",retry:"إعادة المحاولة",
 preview_nosave:"وضع المعاينة: لا يتم حفظ النتائج.",load_err:"تعذر تحميل هذا الاختبار.",go_back:"رجوع",signin_needed:"الرجاء تسجيل الدخول أولاً.",general:"عام",advanced:"متقدم",all:"الكل",
 Mathematics:"الرياضيات",Science:"العلوم",English:"اللغة الإنجليزية",Arabic:"اللغة العربية","Islamic Education":"التربية الإسلامية","Social Studies":"الدراسات الاجتماعية",Physics:"الفيزياء",Chemistry:"الكيمياء",Biology:"الأحياء","Computer Science":"علوم الحاسوب",Other:"أخرى"});
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
let lang = 'en';
const t = (k,o) => { let s=(T[lang][k]??T.en[k]??k); if(o) for(const x in o) s=s.replace('{'+x+'}',o[x]); return s; };
let TOTAL_Q = 0, TOTAL_MARKS = 0, PASS_MARK = 0, EXAM_TITLE = '';
const mk = q => Number(q.marks) || C.marksPerQuestion || 1;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const trk = x => t(String(x||'').toLowerCase());
/*@JS_HELPERS@*/
// Escaped money signs (\$12) outside math must not start KaTeX: isolate each one in its own <span>
function protectDollars(root){
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT), nodes=[]; while(w.nextNode()) if(w.currentNode.data.includes('\\$')) nodes.push(w.currentNode);
  nodes.forEach(n=>{ const s=n.data, frag=document.createDocumentFragment(); let buf='', inM=false;
    for(let i=0;i<s.length;i++){ if(s[i]==='\\'&&s[i+1]==='$'){ if(inM){buf+='\\$';} else { frag.append(buf); buf=''; const sp=document.createElement('span'); sp.className='usd'; sp.textContent='$'; frag.append(sp); } i++; }
      else { if(s[i]==='$'){ inM=!inM; if(s[i+1]==='$'){ buf+='$'; i++; } } buf+=s[i]; } }
    frag.append(buf); n.replaceWith(frag); });
}
const _katexMath = math; math = el => { protectDollars(el); _katexMath(el); };

/* ---------- language ---------- */
function applyLang(){
  document.documentElement.lang=lang; document.documentElement.dir = lang==='ar'?'rtl':'ltr';
  $$('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
  $$('[data-ph]').forEach(e=>e.placeholder=t(e.dataset.ph));
  $$('[data-t]').forEach(e=>e.title=t(e.dataset.t));
  $('#tbSub').textContent = `${t(C.subject)} · ${C.term}`; refreshTopTitle(); buildA11y();
  if($('#prevBanner')) $('#prevBanner').textContent = t('preview_banner');
  if(st.qs && !st.submitted) { renderQ(); buildLeft(); updateTimer(); }
  if($('#calc').classList.contains('on')) buildCalc();
}
function toggleLang(){ lang = lang==='en'?'ar':'en'; try{localStorage.setItem('zec.lang',lang);}catch(_){} applyLang(); if(st.submitted) showResults(); }
function refreshTopTitle(){ $('#tbMain').innerHTML = `${esc(EXAM_TITLE)} <small>(${TOTAL_Q} ${t('questions')})</small>`; }

/*@JS_UI@*/

/* ---------- state ---------- */
let st = { user:'', qs:null, answers:[], marked:[], seen:[], strike:[], smode:[], hl:[], cur:0, remaining:0, timer:null, startedAt:null, endedAt:null, submitted:false, seenT:null, rightOpen:true, passOpen:true, saved:null, saveErr:null, payload:null };
function show(id){ $$('.screen').forEach(s=>s.classList.toggle('on',s.id===id)); }
$$('[data-lang]').forEach(b=>b.onclick=toggleLang);

/* ---------- load exam from API ---------- */
function portalUrl(){ if(!ME) return 'index.html'; return ME.role==='student'?'student.html':ME.role==='admin'?'admin.html':'teacher.html'; }
function loadFail(msg){ $('#loadScreen').innerHTML=`<div class="lerr">${esc(t('load_err'))}<br><small>${esc(msg||'')}</small></div><button class="lbtn" onclick="location.href=portalUrl()">${t('go_back')}</button>`; }
const plainTxt = h => String(h||'').replace(/<[^>]+>/g,'').replace(/\$+([^$]*)\$+/g,'$1').replace(/\\[a-zA-Z]+/g,' ').replace(/[{}]/g,'').replace(/\s+/g,' ').trim();
// ---------------------------------------------------------------------------
// Which language the exam CONTENT is shown in (school rule):
//   Maths, Science, Physics, Chemistry -> English AND Arabic side by side (English left, Arabic right), every track
//   Biology -> English only;  Arabic, Islamic Education, Social Studies -> Arabic;  English -> English.
// If the chosen language is missing for a question/answer/passage, the other language is shown instead of a blank.
// ---------------------------------------------------------------------------
const STEM_SUBJ=['Mathematics','Science','Physics','Chemistry','Biology','Computer Science'], AR_SUBJ=['Arabic','Islamic Education','Social Studies'];
let CONTENT_LANG=null;
function contentLang(){ const s=EXAM.subject; if(AR_SUBJ.includes(s)) return 'ar'; if(s==='English' || s==='Biology') return 'en';
  return null; }   // null = show both languages (side by side)
const blankTxt=v=>!String(v??'').replace(/<[^>]*>/g,'').trim();
function applyContentLang(){
  CONTENT_LANG=contentLang(); if(!CONTENT_LANG) return;
  const ar=CONTENT_LANG==='ar';
  SOURCE_QUESTIONS.forEach(q=>{
    if(ar){ if(!blankTxt(q.ar)) q.en=''; } else { if(!blankTxt(q.en)) q.ar=''; }
    q.options=q.options.map((o,k)=>{ const a=q.options_ar[k]; return ar ? (blankTxt(a)?o:a) : (blankTxt(o)?a:o); });
    q.options_ar=q.options.map(()=>'');
    if(q.passage){ const p={...q.passage}; if(ar){ if(!blankTxt(p.ar)) p.en=''; } else { if(!blankTxt(p.en)) p.ar=''; } q.passage=p; }
    q.title=plainTxt(q.en||q.ar).slice(0,110);
  });
}
// "English / عربي" written in ONE cell (common in uploaded files) -> split into the English and the Arabic part, so the
// answer shows as two separate lines like the question. Splits only at " / " or " | " OUTSIDE $…$ maths, and only when
// one side is Arabic and the other is not. Exams already uploaded are fixed on screen without re-uploading.
const AR_LETTER=/[؀-ۿ]/, noMath=s=>String(s).replace(/\$[^$]*\$/g,'');
function splitBi(s){ s=String(s??''); if(!AR_LETTER.test(noMath(s)) || !/[A-Za-z]{2}/.test(noMath(s))) return null;
  let inM=false;
  for(let i=0;i<s.length;i++){ const c=s[i];
    if(c==='\\'&&s[i+1]==='$'){ i++; continue; }
    if(c==='$'){ inM=!inM; continue; }
    if(!inM && /\s/.test(c) && (s[i+1]==='/'||s[i+1]==='|') && /\s/.test(s[i+2]||'')){
      const a=s.slice(0,i).trim(), b=s.slice(i+2).trim(), aAr=AR_LETTER.test(noMath(a)), bAr=AR_LETTER.test(noMath(b));
      if(a && b && aAr!==bAr) return aAr ? { en:b, ar:a } : { en:a, ar:b };
    } }
  return null; }
function splitCombined(){
  SOURCE_QUESTIONS.forEach(q=>{
    q.options.forEach((o,k)=>{ if(String(q.options_ar[k]||'').trim()) return; const sp=splitBi(o); if(sp){ q.options[k]=sp.en; q.options_ar[k]=sp.ar; } });
    if(!String(q.ar||'').trim()){ const sp=splitBi(q.en); if(sp){ q.en=sp.en; q.ar=sp.ar; } }
  });
}
async function boot(){
  try{ lang = localStorage.getItem('zec.lang') || ''; }catch(_){}
  ME = await API.me();
  if(!ME){ location.replace('index.html'); return; }
  if(ME.role!=='student') PREVIEW = true;            // staff never create attempts
  const id = PARAMS.get('id'); if(!id){ loadFail('Missing exam id'); return; }
  try{ EXAM = await API.exam(id); }catch(e){ loadFail(e.message); return; }
  const cfg = EXAM.config || {};
  C = Object.assign({ durationMinutes:60, marksPerQuestion:1, passingPercent:50, calculatorAllowed:false, allowBacktrack:true, shuffleQuestions:false, shuffleOptions:true,
        requireSeenAll:true, showReviewAfterSubmit:true, defaultLanguage:'en', extraInstructions:[] }, cfg, {
        subject: EXAM.subject, grade: `${EXAM.grade_num}${EXAM.track && EXAM.track!=='All' ? ' '+EXAM.track : ''}`, term: EXAM.term,
        teacher: EXAM.teacher_name, author: EXAM.teacher_name, academicYear: (window.APP_CONFIG||{}).academicYear || '2026–2027' });
  if(!Array.isArray(C.extraInstructions)) C.extraInstructions = C.extraInstructions ? [String(C.extraInstructions)] : [];
  if(!lang) lang = C.defaultLanguage === 'ar' ? 'ar' : 'en';
  const P = EXAM.passages || {};
  SOURCE_QUESTIONS = EXAM.questions.map((q,i)=>({ ...q, oi:i, options:(q.options||[]).map(o=>o==null?'':String(o)),
    option_images:(q.options||[]).map((_,k)=>(q.option_images||[])[k]||''),
    options_ar:(q.options||[]).map((_,k)=>String((q.options_ar||[])[k]??'')),
    title: plainTxt(q.en||q.ar).slice(0,110), passage: q.passage_id && P[q.passage_id] ? { id:q.passage_id, ...P[q.passage_id] } : null }));
  splitCombined(); applyContentLang(); if(CONTENT_LANG) lang = CONTENT_LANG;   // school language rule (see contentLang)
  TOTAL_Q = SOURCE_QUESTIONS.length; TOTAL_MARKS = SOURCE_QUESTIONS.reduce((a,q)=>a+mk(q),0);
  PASS_MARK = Math.ceil(TOTAL_MARKS*C.passingPercent/100);
  EXAM_TITLE = EXAM.title || `Grade ${C.grade} - ${C.subject} - ${C.term}`;
  document.title = EXAM_TITLE;
  st.user = ME.role==='student' ? ME.student_id : (ME.name || 'Preview');
  if(PREVIEW){ const b=document.createElement('div'); b.className='prev-banner'; b.id='prevBanner'; $('#examScreen').prepend(b); }
  applyA(); applyLang(); startExam();
}

/* ---------- start / timer ---------- */
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
function startExam(){
  let q = SOURCE_QUESTIONS.slice();
  if(C.shuffleQuestions){                      // shuffle inside each Section_Part; passage groups stay together and in order
    const parts=[]; q.forEach(x=>{ const k=x.section_part||''; let p=parts.find(y=>y.k===k); if(!p) parts.push(p={k,items:[]}); p.items.push(x); });
    q = parts.flatMap(p=>{ const blocks=[]; p.items.forEach(x=>{ const last=blocks[blocks.length-1]; if(x.passage_id && last && last[0].passage_id===x.passage_id) last.push(x); else blocks.push([x]); }); return shuffle(blocks).flat(); });
  }
  q = q.map(x=>{ const idx=x.options.map((_,i)=>i); const o=C.shuffleOptions?shuffle(idx):idx; return {...x,omap:o,options:o.map(i=>x.options[i]),option_images:o.map(i=>x.option_images[i]),options_ar:o.map(i=>x.options_ar[i]),correct:o.indexOf(x.correct)}; });
  const n=q.length;
  Object.assign(st,{qs:q,answers:Array(n).fill(null),marked:Array(n).fill(false),seen:Array(n).fill(false),strike:q.map(()=>new Set()),smode:Array(n).fill(false),hl:Array(n).fill(null),cur:0,
    remaining:C.durationMinutes*60,startedAt:new Date(),endedAt:null,submitted:false,saved:null,saveErr:null,payload:null,passOpen:true});
  $('#btnCalc').style.display = C.calculatorAllowed?'':'none';
  $('#btnMenu').style.visibility = C.allowBacktrack?'visible':'hidden';
  show('examScreen'); buildLeft(); go(0); updateTimer(); showInstructions();
  clearInterval(st.timer);
  st.timer=setInterval(()=>{ if(!C.durationMinutes) return; st.remaining--; updateTimer(); if(st.remaining<=0){ clearInterval(st.timer); toast('warning',t('time_up')); finish(); } },1000);
}
function updateTimer(){ const e=$('#timer'); if(!C.durationMinutes){e.textContent=t('no_limit');return;} e.textContent=fmt(st.remaining); e.classList.toggle('low',st.remaining<=600&&st.remaining>60); e.classList.toggle('crit',st.remaining<=60); }
window.addEventListener('beforeunload',e=>{ if($('#examScreen').classList.contains('on')&&!st.submitted){e.preventDefault();e.returnValue='';} });

/* ---------- instruction / info modals ---------- */
function showInstructions(){
  const extra=C.extraInstructions.map(x=>`<p>${esc(x)}</p>`).join('');
  const parts=[...new Set(SOURCE_QUESTIONS.map(q=>q.section_part).filter(Boolean))];
  const partsHtml=parts.length?`<p style="font-weight:700">${parts.map(p=>{ const qs=SOURCE_QUESTIONS.filter(q=>q.section_part===p); return `${esc(p)} · ${qs.length} ${t('questions')} · ${qs.reduce((a,q)=>a+mk(q),0)} ${t('marks')}`; }).join('<br>')}</p>`:'';
  openModal(`<div class="minfo"><h2><span>${t('sec')}</span><button class="x" onclick="closeModal()">&times;</button></h2>
   <p>${t('sec_here')}</p><p>${C.durationMinutes?t('sec_time',{n:C.durationMinutes}):t('sec_nolim')}</p>
   <p><b>${C.calculatorAllowed?t('calc_y'):t('calc_n')}</b></p>${partsHtml}${extra}<p style="color:#667;font-size:12px">${t('tools')}</p>
   <div class="mbtns"><button class="b-ok" onclick="closeModal()">${t('close')}</button></div></div>`,true);
}
$('#btnInstr').onclick=showInstructions;
$('#btnInfo').onclick=()=>{
  const r=(a,b)=>`<tr><td>${a}</td><td>${b}</td></tr>`;
  const stu = ME && ME.role==='student' ? r(t('i_id'),esc(ME.student_id))+r(t('i_section'),esc(ME.section)) : r(t('i_stu'),esc(st.user));
  openModal(`<div class="minfo"><h2><span>${t('i_title')}</span><button class="x" onclick="closeModal()">&times;</button></h2>
  <table class="infotab">${stu}${r('',esc(EXAM_TITLE))}${r(t('i_sub'),t(C.subject))}${r(t('i_grade'),esc(EXAM.grade_num))}${r(t('i_track'),trk(EXAM.track))}${r(t('i_term'),esc(C.term)+' · '+esc(C.academicYear))}${r(t('i_teacher'),esc(C.teacher))}

  const s=score(), clean=x=>plainTxt(x);

  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([["Student",st.user],["Section",ME&&ME.section||''],["Exam",EXAM_TITLE],["Subject",C.subject],["Grade",EXAM.grade_num],["Track",EXAM.track],["Term",C.term],["Score",`${s.got} / ${TOTAL_MARKS}`],["Percent",(TOTAL_MARKS?s.got/TOTAL_MARKS*100:0).toFixed(1)+"%"],["Date",Reports.fmtDate(st.endedAt.toISOString())]]),"Summary");
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([["#","Part","Topic","Question","Your answer","Correct answer","Marks"],...s.rows.map(r=>[r.i+1,r.q.section_part||'',r.q.topic||'',clean(r.q.en||r.q.ar),r.pk===null?'-':optPlain(r.q,r.pk),optPlain(r.q,r.q.correct),r.ok?mk(r.q):0])]),"Answers");
  XLSX.writeFile(wb,`Exam_${String(st.user).replace(/\s+/g,'_')}_${C.term.replace(/\s+/g,'')}.xlsx`); }
