  .step-n.done { background: var(--lime); color: #ffffff; }
  .helper { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; background: linear-gradient(90deg, var(--olive-50), var(--sky-2)); border: 1px solid var(--olive-pale); border-radius: 12px; padding: 12px 14px; margin-top: 14px; }

  .drop.over { background: var(--sky); border-color: var(--blue); }
  .drop img { width: 72px; display: block; margin: 0 auto 8px; }
  .drop b { color: var(--navy); font-size: 16px; display: block; }
  .blueprint { margin-top: 14px; border: 1px solid var(--olive-pale); border-inline-start: 6px solid var(--olive); border-radius: 12px; padding: 12px 14px; background: #fff; }
  .bp-h { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; } .bp-h img { width: 38px; } .bp-h b { color: var(--olive); display: block; } .bp-h span { font-size: 12.5px; color: var(--muted); }
  .bp-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
  .bp-grid > div { background: var(--olive-50); border-radius: 10px; padding: 8px 10px; } .bp-grid span { display: block; font-size: 11.5px; font-weight: 800; color: var(--olive-2); }
  .bp-grid b { font-size: 18px; color: var(--olive); } .bp-grid small { display: block; font-size: 11px; color: var(--muted); }
  .sec-list { display: flex; flex-wrap: wrap; gap: 8px 16px; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: var(--radius-s); background: #fff; min-height: 42px; }
  .qcard { border: 1px solid var(--line); border-radius: 12px; background: #fff; overflow: hidden; outline: 0; }
  .qcard:focus-within, .qcard.active { box-shadow: 0 0 0 3px rgba(137,25,30,.3); border-color: var(--blue); }
  .qcard .qh { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 10px 14px; background: #FCF3ED; border-bottom: 1px solid var(--line-2); }
  .qcard .qh .qn { font-weight: 800; color: var(--navy); }
  .qcard .qb { padding: 12px 14px; display: grid; grid-template-columns: minmax(0, 1fr) 230px; gap: 14px; }
  .qcard .stem-en { direction: ltr; text-align: left; font-weight: 700; }
  .qcard .stem-ar { direction: rtl; text-align: right; font-weight: 700; font-family: 'Noto Naskh Arabic', Tahoma, sans-serif; margin-top: 6px; }
  .qcard ol.opts { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 6px; }
  .qcard ol.opts li { border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; display: flex; gap: 8px; align-items: baseline; }
  .qcard ol.opts li.ok { background: var(--ok-bg); border-color: #B9DCCB; font-weight: 800; }
  .qcard ol.opts li .l { color: var(--muted); font-weight: 800; min-width: 18px; }
  .qcard ol.opts li .ob { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
  .qcard ol.opts li .oimg { max-width: 180px; max-height: 140px; border: 1px solid var(--line); border-radius: 6px; background: #fff; display: block; }
  .qcard ol.opts li .otools { margin-inline-start: auto; display: flex; gap: 4px; align-items: center; flex-shrink: 0; }
  .qcard ol.opts li .otools button { border: 1px solid var(--line); background: #fff; border-radius: 6px; padding: 2px 7px; font-size: 11px; cursor: pointer; color: var(--muted); font-family: inherit; }
  .qcard ol.opts li .otools button:hover { border-color: var(--olive, #89191E); color: var(--olive, #89191E); }
  .qcard ol.opts li .otools button.rm:hover { border-color: #C0392B; color: #C0392B; }
  .qcard .fb { background: var(--warn-bg); border-radius: 8px; padding: 6px 10px; font-size: 13px; margin-top: 8px; }
  .qcard .hint { background: var(--sky-2); border-radius: 8px; padding: 6px 10px; font-size: 13px; margin-top: 6px; }
  .imgbox { border: 1.5px dashed var(--line); border-radius: 10px; min-height: 150px; display: flex; align-items: center; justify-content: center; background: #FBF8F5; overflow: hidden; }

  .imgbox .none { color: var(--muted); font-size: 12px; text-align: center; padding: 10px; }
  .imgbtns { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }

<div id="appHeader"></div>
<main class="page">

    <button data-tab="tab-results"><img src="assets/ornaments/analytics.svg" alt=""><span data-i18n="t_results"></span></button>
  </div>

  <!-- ============== UPLOAD ============== -->
  <section class="tab-panel" id="tab-upload"><div class="steps">
    <div class="card">
      <div class="card-h"><span class="step-n" id="s1n">1</span><div><h2 data-i18n="s1_title"></h2><div class="sub" data-i18n="s1_sub"></div></div></div>
      <div class="card-b">
        <div class="grid g4">
          <label class="field" style="grid-column:span 2"><span data-i18n="subject"></span><select class="input" id="uDept"></select></label>
          <label class="field" style="grid-column:span 2"><span data-i18n="teacher_name"></span><select class="input" id="uTeacher"></select></label>
          <label class="field"><span data-i18n="grade"></span><select class="input" id="uGrade"></select></label>
          <label class="field"><span data-i18n="track"></span><select class="input" id="uTrack"></select></label>
          <label class="field" hidden><span data-i18n="science_branch"></span><select class="input" id="uSubject"></select></label>
          <label class="field"><span data-i18n="term"></span><select class="input" id="uTerm"></select></label>
          <div class="field" style="grid-column:1/-1"><span data-i18n="target_sections"></span><div class="sec-list" id="uSecs"></div></div>
        </div>
        <div class="blueprint" id="blueprint"></div>
        <div class="helper">
          <img src="assets/ornaments/idea-box.svg" alt="">
          <div class="txt"><b id="helperTitle"></b><span id="helperSub"></span></div>
          <button class="btn btn-olive" id="btnTemplate"></button>
          <button class="btn btn-navy" id="btnPrompt"></button>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-h"><span class="step-n" id="s2n">2</span><div><h2 data-i18n="s2_title"></h2><div class="sub" data-i18n="s2_sub"></div></div></div>
      <div class="card-b">
        <label class="drop" id="drop"><input type="file" id="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>
          <img src="assets/ornaments/archive.svg" alt=""><b data-i18n="drop_t"></b><span class="muted small" data-i18n="drop_s"></span></label>
        <div id="parseOut" style="margin-top:14px"></div>
      </div>
    </div>

    <div class="card" id="step3" hidden>
      <div class="card-h"><span class="step-n" id="s3n">3</span><div><h2 data-i18n="s3_title"></h2><div class="sub" data-i18n="s3_sub"></div></div></div>
      <div class="card-b" id="publishBox"></div>
    </div>
  </div></section>

  <!-- ============== MANAGE ============== -->
  <section class="tab-panel" id="tab-manage"><div class="card"><div class="card-h"><img class="ill" src="assets/ornaments/checklist.svg" alt=""><div><h2 data-i18n="t_manage"></h2><div class="sub" data-i18n="manage_sub"></div></div></div><div class="card-b" id="manageHost"></div></div></section>

  <!-- ============== RESULTS ============== -->
  <section class="tab-panel" id="tab-results"><div class="card"><div class="card-h"><img class="ill" src="assets/ornaments/analytics.svg" alt=""><div><h2 data-i18n="t_results"></h2><div class="sub" data-i18n="results_sub"></div></div></div><div class="card-b" id="resultsHost"></div></div></section>
</main>

const toDataUrl = (bytes, ext) => new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(new Blob([bytes], { type: ext === 'svg' ? 'image/svg+xml' : 'image/' + (ext === 'jpg' ? 'jpeg' : ext) })); });
// downscale very large pictures so exams stay light (max 1400 px, keeps PNG transparency)
function shrink(dataUrl) {
  return new Promise(res => { const img = new Image(); img.onload = () => { const max = 1400; if (img.width <= max && img.height <= max) return res(dataUrl);
    const k = Math.min(max / img.width, max / img.height), c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); res(c.toDataURL(dataUrl.startsWith('data:image/png') ? 'image/png' : 'image/jpeg', .9)); }; img.onerror = () => res(dataUrl); img.src = dataUrl; });
}

      <span class="badge b-gray num">${t('cfg_dur')}: ${c.durationMinutes ? c.durationMinutes + ' ' + t('minutes') : t('no_limit')}</span>
      <span class="badge ${c.calculatorAllowed ? 'b-ok' : 'b-gray'}">${t('cfg_calc')}: ${c.calculatorAllowed ? t('yes') : t('no')}</span></div>
    <div class="row sticky-pub"><button class="btn btn-primary" id="pubNow" ${ok ? '' : 'disabled'}>${UI.ICONS.check}<span>${t('publish_now')}</span></button><button class="btn btn-ghost" id="pubHidden" ${ok ? '' : 'disabled'}>${t('save_hidden')}</button></div>`;
  $('#pTitle').oninput = e => { parsed.title = e.target.value; };
  $('#pubNow').onclick = () => publish(true); $('#pubHidden').onclick = () => publish(false);
}
async function publish(visible) {
  const tg = target(); const title = ($('#pTitle').value || '').trim();
  if (!title) { UI.toast(t('no_title'), 'warn'); return; }
  if (!picker.get().known) { UI.toast(t('pick_teacher'), 'warn'); $('#uTeacher').focus(); return; }
  const btns = $$('#publishBox .btn'); btns.forEach(b => (b.disabled = true));
  try {
    const config = { ...parsed.config, examTitle: title, subject: tg.subject, grade: tg.grade_num, track: tg.track, term: tg.term, teacher: tg.teacher_name, author: tg.teacher_name };
    const questions = parsed.questions.map(({ row, image_ref, option_image_refs, option_images, ...q }) =>
      (option_images || []).some(Boolean) ? { ...q, option_images: q.options.map((_, k) => option_images[k] || '') } : q);
    const res = await API.createExam({ title, ...tg, config, passages: parsed.passages, questions, is_published: visible });
    UI.toast(visible ? t('pub_ok') : t('pub_saved'), 'ok');
    $('#s3n').classList.add('done');
    $('#publishBox').innerHTML = `<div class="notice ok" style="align-items:center;flex-wrap:wrap"><img src="${UI.ORN('easel')}" alt="" style="width:56px"><div style="flex:1"><b>${visible ? t('pub_ok') : t('pub_saved')}</b><div dir="auto">${esc(title)}</div></div>
      <a class="btn btn-primary" href="exam.html?id=${encodeURIComponent(res.id)}&preview=1" target="_blank" rel="noopener">${UI.ICONS.eye}<span>${t('open_prev')}</span></a><button class="btn btn-ghost" id="again">${t('upload_another')}</button></div>`;
    $('#again').onclick = () => { parsed = null; $('#parseOut').innerHTML = ''; $('#step3').hidden = true; $$('.step-n').forEach(s => s.classList.remove('done')); window.scrollTo({ top: 0, behavior: 'smooth' }); };
    manage && manage.reload(); results && results.reload();
  } catch (e) { UI.handle(e); btns.forEach(b => (b.disabled = false)); }
}

/* ---------------- boot ---------------- */
let manage = null, results = null;
(async () => {
  try { S = await UI.requireRole('teacher', 'admin'); } catch (_) { return; }
  if (S.role === 'admin') S = { ...S, name: '', grade: 8, track: 'General', subject: 'Mathematics' };
  ACTIVE_TERM = await UI.header({ session: S, title: t('portal'), subtitle: t('portal_sub'), ornament: 'presentation' });
  UI.footer();
  try { SECS = await Panels.sections(); } catch (e) { UI.handle(e); }
  fillStep1();
  I18N.apply();
  UI.tabs($('main'));
  manage = Panels.examsManager($('#manageHost'), { term: ACTIVE_TERM, grade: S.role === 'teacher' ? '' : (S.grade || ''), subject: '', me: S });
  results = Panels.results($('#resultsHost'), { term: ACTIVE_TERM, grade: S.grade || '' });
  I18N.onChange(() => { UI.setHero(t('portal'), t('portal_sub')); fillStep1(); if (parsed) render(); });
})();
</script>
</body>
