<style>
:root{--navy:#1f4259;--navy-d:#12324a;--circle:#24475b;--ink:#17384f;--bar:#e8edf1;--bar-b:#cdd6dc;--page:#fff;--row:#d5e4ef;--row-b:#a9bccb;--rowcur:#cfd5d9;
--green:#8acc36;--pink:#f95484;--btn-g:#5cb85c;--blue:#4a7fb5;--text:#1d2b36;--card:#fff;--line:#dfe5ea;--side:#dfe5e9;--muted:#6b7b87;
--stem:17px;--opt:15px;--gap:14px;--lh:1.55;--font:'Nunito','Segoe UI',Tahoma,Arial,sans-serif}
body.dark{--bar:#14212b;--bar-b:#2b3b48;--page:#0f1a22;--row:#22384a;--row-b:#3a5367;--rowcur:#2f4a60;--text:#e6eef3;--ink:#cfe3f1;--card:#16232d;--line:#2c3e4c;--side:#16232d;--circle:#3d7aa8;--muted:#9fb1bd}
body.spacing{--gap:26px;--lh:2}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--page);color:var(--text);line-height:var(--lh);overflow:hidden}
button{font-family:inherit;cursor:pointer}
svg{width:22px;height:22px;fill:currentColor;display:block}
.screen{display:none;position:absolute;inset:0;overflow:auto}
.screen.on{display:block}
#examScreen.on{display:flex;flex-direction:column;overflow:hidden}
img{max-width:100%}
body.magnify .stem img,body.magnify .opt img{transform:scale(1.5);transform-origin:left top;margin-bottom:60px}

/* ---------- exam top bar ---------- */
.topbar{display:flex;align-items:stretch;background:var(--bar);border-bottom:1px solid var(--bar-b);height:56px;color:var(--ink);flex:none;z-index:50;position:relative}
.hamb{width:56px;background:none;border:0;border-right:1px solid var(--bar-b);color:var(--ink);display:flex;align-items:center;justify-content:center}
.tb-title{padding:6px 18px;display:flex;flex-direction:column;justify-content:center;min-width:0;flex:1}
.tb-sub{font-size:11px;font-weight:600;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-main{font-size:17px;font-weight:800;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-main small{font-weight:400;font-size:11px}
.seg{display:flex;align-items:center;gap:6px;padding:0 12px;border-left:1px solid var(--bar-b)}
.seg.first{border-left:0}
.tbtn{background:none;border:0;color:var(--ink);padding:5px;border-radius:4px;position:relative}
.tbtn:hover{background:rgba(0,0,0,.08)}
.tbtn svg{width:19px;height:19px}
.circ{width:30px;height:30px;border-radius:50%;background:var(--circle);color:#fff;border:0;display:flex;align-items:center;justify-content:center}
.circ svg{width:17px;height:17px}.circ:disabled{opacity:.35;cursor:not-allowed}
.pg{font-size:13px;min-width:44px;text-align:center}
.pill{background:var(--btn-g);color:#fff;border:0;border-radius:3px;padding:4px 14px;font-weight:700;font-size:13px;display:none}.pill.on{display:block}
#btnMark svg{fill:none;stroke:var(--pink);stroke-width:2}#btnMark.on svg{fill:var(--pink)}
.timer{font-size:14px;font-weight:600;min-width:62px;text-align:center}
.timer.low{color:#d98a00}.timer.crit{color:var(--pink);animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.4}}
.gear-menu{position:absolute;top:44px;left:-6px;background:#fff;border:1px solid #ccc;border-radius:4px;box-shadow:0 4px 12px rgba(0,0,0,.2);padding:4px;display:none;z-index:80}
.gear-menu.on{display:block}.gear-menu .tbtn{display:block;color:#24475b}
[dir=rtl] .circ svg,[dir=rtl] .back-ic{transform:scaleX(-1)}

/* ---------- exam body ---------- */
.body{flex:1;position:relative;display:flex;min-height:0}
#leftbar{position:absolute;left:0;top:0;bottom:0;width:340px;max-width:90%;background:var(--bar);border-right:1px solid var(--bar-b);overflow:auto;transform:translateX(-102%);transition:transform .25s;z-index:40;box-shadow:3px 0 8px rgba(0,0,0,.15)}
[dir=rtl] #leftbar{left:auto;right:0;transform:translateX(102%)}
#leftbar.on{transform:none}
.userbox{display:flex;gap:12px;padding:8px;background:var(--bar)}
.avatar{width:70px;height:70px;background:#c3c8cc;color:#fff;flex:none}.avatar svg{width:70px;height:70px}
.userbox .nm{font-size:12px;color:var(--muted);font-weight:600}
.btn-sub{display:block;width:100%;background:var(--btn-g);color:#fff;border:0;font-weight:800;font-size:17px;padding:5px;margin-top:5px;border-radius:2px}
.qrow{display:flex;border-bottom:1px solid var(--row-b);background:var(--row);cursor:pointer;min-height:54px}
.qrow .strip{width:9px;background:#444;flex:none}.qrow.ans .strip{background:var(--green)}.qrow.mk .strip{background:var(--pink)}
.qrow.cur{background:var(--rowcur)}
.qrow .lbl{padding:14px 16px;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text);min-width:0}
#stage{flex:1;display:flex;position:relative;min-width:0}
#passage{display:none;width:40%;overflow:auto;background:var(--row);padding:22px;font-size:14px;border-right:1px solid var(--row-b)}
#passage.on{display:block}
#qpane{flex:1;overflow:auto;padding:26px 40px 90px;background:var(--page);min-width:0}
body.calc-open #qpane{padding-bottom:420px}
.stem{font-weight:800;color:var(--ink);font-size:var(--stem);line-height:var(--lh);margin-bottom:var(--gap)}
.stem-en{direction:ltr;text-align:left}
.stem-ar{direction:rtl;text-align:right;font-family:'Tahoma','Segoe UI',Arial;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);unicode-bidi:isolate}
.stem-ar .katex{direction:ltr;unicode-bidi:isolate}
mark.hl{background:#fff176;color:#000;padding:0}
.strike-row{display:flex;justify-content:flex-end;margin:6px 0}
.strike-btn{width:34px;height:30px;background:#fff;color:#24475b;border:1px dashed #666;font-family:Georgia,serif;font-style:italic;font-size:19px;text-decoration:underline;border-radius:2px}
.strike-btn.on{background:#d5e4ef;border-style:solid}
.opts{display:flex;flex-direction:column;gap:12px;direction:ltr}
.opt{display:grid;grid-template-columns:34px 1fr auto 30px;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);padding:14px 16px;min-height:54px;cursor:pointer;position:relative;font-size:var(--opt);color:var(--ink);font-weight:600}
.opt:hover{background:rgba(120,150,180,.1)}
.opt .l{color:var(--muted);font-size:12px}
.opt .r{width:22px;height:22px;border:2px solid var(--ink);border-radius:50%;display:flex;align-items:center;justify-content:center}
.opt.sel{border:2px dashed var(--ink)}.opt.sel .r::after{content:"";width:11px;height:11px;border-radius:50%;background:var(--ink)}
.opt .x{display:none;font-weight:800;color:var(--ink);font-size:16px;padding:0 6px}
.opts.sm .opt .x{display:block}
.opt.struck{background:#d4d4d4;color:#444}.opt.struck::before{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:var(--ink)}
.opt.struck .x{font-size:12px;font-weight:600}
body.dark .opt.struck{background:#33414c}
.hintbox{margin-top:16px;padding:10px 14px;background:#fff7d6;border-left:4px solid #e8b400;color:#533;font-size:14px;display:none}
#rightbar{width:118px;background:var(--side);border-left:1px solid var(--bar-b);flex:none;font-size:13px;color:var(--ink)}
#rightbar.off{display:none}
#rightbar .mk{padding:8px 10px;background:var(--bar);text-align:center;font-weight:600;border-bottom:1px solid var(--bar-b)}
#rightbar .lo{padding:10px;font-size:11px;color:var(--muted);word-break:break-word}
.fab{position:absolute;width:40px;height:40px;border-radius:50%;background:var(--circle);color:#fff;border:0;display:flex;align-items:center;justify-content:center;z-index:20;box-shadow:0 2px 6px rgba(0,0,0,.3)}
#fabInfo{top:56px;right:98px}#fabInfo.off{right:8px}
#fabTrash{bottom:22px;right:14px}#fabHint{top:104px;right:98px;display:none}#fabHint.off{right:8px}
#fabPass{top:18px;left:-14px;display:none;border-radius:0 20px 20px 0;width:34px}
.progress{height:22px;background:var(--navy-d);position:relative;flex:none;text-align:center;color:#fff;font-size:12px;font-weight:600;line-height:22px}
.progress .fill{position:absolute;left:50%;top:0;bottom:0;background:var(--green);transform:translateX(-50%);transition:width .3s;width:0}
.progress span{position:relative}

/* ---------- toasts / modals ---------- */
#toasts{position:fixed;top:14px;right:14px;z-index:5000;display:flex;flex-direction:column;gap:10px}
.toast{width:340px;padding:14px 16px;color:#fff;display:flex;gap:14px;border-radius:3px;box-shadow:0 4px 14px rgba(0,0,0,.25);animation:sl .3s}
@keyframes sl{from{transform:translateX(40px);opacity:0}}
.toast svg{width:34px;height:34px;flex:none}
.toast .tb{border-left:1px solid rgba(255,255,255,.5);padding-left:12px}
.toast b{display:block;font-size:15px}.toast small{opacity:.7;font-size:10px}
.toast.success{background:#8ac43a}.toast.warning{background:#ff9800}.toast.error{background:#e5476f}
.mback{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:4000;padding:16px}.mback.on{display:flex}
.modal{background:#fff;color:#333;border-radius:6px;box-shadow:0 8px 30px rgba(0,0,0,.3);max-width:520px;width:100%;padding:22px 26px;max-height:90vh;overflow:auto}
.modal.wide{max-width:760px}
.modal h2{font-weight:300;font-size:24px;color:#444;margin-bottom:12px}
.modal p{font-size:14px;color:#555;margin-bottom:8px;line-height:1.5}
.mbtns{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.b-ok{background:#5cb85c;color:#fff;border:0;padding:9px 16px;font-weight:700;font-size:13px;border-radius:3px}
.b-no{background:#eceff1;color:#333;border:0;padding:9px 16px;font-weight:700;font-size:13px;border-radius:3px}
.minfo h2{font-weight:800;font-size:17px;color:#17384f;display:flex;justify-content:space-between}
.minfo{text-align:center}.minfo p{text-align:center}
.minfo .x{background:none;border:0;font-size:20px;cursor:pointer}
.infotab{width:100%;font-size:13px;text-align:left;margin-top:10px;border-collapse:collapse}.infotab td{padding:5px 8px;border-bottom:1px solid #eee}.infotab td:first-child{font-weight:700;color:#17384f;width:40%}

/* ---------- accessibility ---------- */
#a11y{position:fixed;right:0;top:56px;bottom:22px;width:290px;background:#dfe7ec;color:#143b4c;z-index:60;padding:14px 18px;overflow:auto;transform:translateX(102%);transition:transform .25s;box-shadow:-3px 0 10px rgba(0,0,0,.2)}
#a11y.on{transform:none}
#a11y h3{font-size:18px;display:flex;justify-content:space-between;margin-bottom:10px}
#a11y .reset{width:100%;background:#0e4a5d;color:#fff;border:2px solid #000;padding:8px;font-weight:800;border-radius:3px;margin-bottom:12px}
#a11y h4{font-size:17px;margin:14px 0 8px;padding-top:10px;border-top:1px solid #9fb2bd}
#a11y .sw{position:relative;width:60px;height:32px;background:#0e4a5d;border-radius:16px;border:0;display:block}
#a11y .sw::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;background:#fff;border-radius:50%;transition:.2s}
#a11y .sw.on::after{left:32px}
#a11y label{display:flex;gap:8px;align-items:center;margin:6px 0;font-size:14px;cursor:pointer}
#a11y input[type=range]{width:100%;accent-color:#8acc36}
.themes{display:flex;gap:10px}.themes button{flex:1;height:40px;border:2px solid #0e4a5d;font-weight:800;font-size:18px;border-radius:3px}
.themes .th-l{background:#fff;color:#0e4a5d}.themes .th-d{background:#0e4a5d;color:#fff}.themes .act{outline:3px solid #8acc36}

/* ---------- calculator ---------- */
#calc{position:fixed;left:0;right:0;bottom:22px;height:400px;max-height:62vh;background:#fff;border-top:1px solid #bbb;box-shadow:0 -4px 14px rgba(0,0,0,.2);z-index:55;display:none;flex-direction:column;color:#222;direction:ltr;font-family:'Times New Roman',serif}
#calc.on{display:flex}
.c-rows{flex:1;overflow:auto;position:relative}
.c-hint{position:absolute;right:30px;top:20px;text-align:right;color:#777;font-family:var(--font);font-size:15px}
.c-row{display:flex;justify-content:space-between;align-items:center;padding:10px 18px;border-bottom:1px solid #ddd;font-size:22px}
.c-row .rs{display:flex;gap:10px;align-items:center}
.c-in{display:flex;align-items:center;padding:10px 18px;border-top:1px solid #4a85c0;font-size:22px;background:#fff}
.c-in input{flex:1;border:0;outline:0;font:inherit;background:transparent;color:inherit}
.c-res{white-space:nowrap}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;font-size:.75em;line-height:1.1}.fr i{font-style:normal;padding:0 3px}.fr i:first-child{border-bottom:1px solid currentColor}
.fbtn{width:32px;height:32px;border-radius:50%;border:2px solid #666;background:#fff;color:#444;font-size:11px;line-height:1}
.c-tabs{display:flex;align-items:center;gap:26px;background:#ececec;padding:6px 14px 0;border-top:1px solid #ccc;font-family:var(--font);font-size:14px;color:#666}
.c-tabs .t{padding:8px 4px;cursor:pointer;border-bottom:3px solid transparent}.c-tabs .t.on{color:#222;border-color:#4a85c0}
.c-tabs .sp{flex:1}
.c-tabs .deg{border:1px solid #aaa;background:#fff;border-radius:4px;padding:3px 14px;font-size:11px}
.c-tabs button.ic{background:none;border:0;color:#666;font-size:14px}
.c-pad{display:flex;gap:14px;background:#ececec;padding:8px 14px 12px;flex:none}
.c-g{display:grid;gap:5px}.c-g.l{grid-template-columns:repeat(3,64px)}.c-g.n{grid-template-columns:repeat(3,64px)}.c-g.o{grid-template-columns:repeat(2,64px)}
.k{height:42px;background:#fff;border:1px solid #d4d4d4;border-radius:3px;font-family:'Times New Roman',serif;font-size:20px;color:#222}
.k.num{background:#cbcbcb}.k.enter{background:#4a7fb5;color:#fff}.k.op{color:#2d70b3}
#calc.proj .c-row,#calc.proj .c-in{font-size:36px}
#calc.rc{background:#111;color:#fff}#calc.rc .c-in,#calc.rc .c-row{background:#111;border-color:#444}
#calc.rc .c-hint{color:#aaa}
.wrench{position:absolute;right:14px;bottom:215px;background:#fff;border:1px solid #ccc;border-radius:5px;padding:12px;width:290px;box-shadow:0 4px 14px rgba(0,0,0,.25);display:none;font-family:var(--font);font-size:14px}
.wrench.on{display:block}
.wrench .pj{width:100%;padding:12px;border:1px solid #ccc;background:#fff;font-size:15px;margin-bottom:10px}
.wrench .seg3{display:flex;margin:6px 0 10px}.wrench .seg3 button{flex:1;padding:8px;border:1px solid #ccc;background:#fff}.wrench .seg3 .on{background:#555;color:#fff}

/* ---------- results ---------- */
#resultScreen{background:#eef0f2}
.res-top{background:#5f7b8a;color:#fff;display:flex;justify-content:space-between;align-items:center;padding:14px 22px}
.res-top h2{font-size:18px;font-weight:700}.res-top button{background:none;border:0;color:#fff;margin-left:14px}
.res-wrap{max-width:1000px;margin:0 auto;padding:22px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.card{background:#fff;border:1px solid #cfd5da;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.card b{font-size:20px;display:block}.card small{color:#555;font-size:12px}
.card svg{width:26px;height:26px}
.card.pass{background:#8ac43a;color:#fff;border-color:#8ac43a}.card.fail{background:#e5476f;color:#fff;border-color:#e5476f}.card.pass small,.card.fail small{color:#fff}
.chartbox{background:#fff;border:1px solid #cfd5da;padding:16px;margin-bottom:20px;display:flex;gap:28px;align-items:center;flex-wrap:wrap}
.chartbox svg{width:150px;height:150px}.leg i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px}
table.rt{width:100%;border-collapse:collapse;background:#fff;font-size:13px;margin-bottom:22px}
table.rt th{background:#34495a;color:#fff;padding:9px 10px;text-align:left}table.rt td{padding:9px 10px;border:1px solid #ddd}
table.rt td.c{text-align:center}.ok{color:#5cb85c;font-weight:800}.no{color:#e5476f;font-weight:800}
.sect{background:#fff;border-radius:6px;padding:20px 24px;margin-bottom:20px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.sect h3{color:var(--navy);margin-bottom:12px}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.chip{background:#f1f5f9;border-radius:6px;padding:9px 12px;font-size:13px}.chip b{color:var(--navy);display:block}
.rq{border:1px solid #e2e8f0;border-radius:8px;padding:16px;margin-bottom:14px;background:#fafbfc;color:#222}
.rq .opt{cursor:default;margin-bottom:6px;min-height:44px;color:#222;background:#fff}.rq .opt.good{background:#dff2c4;border-color:#8acc36}.rq .opt.bad{background:#fcdfe7;border-color:#f95484}
.rq .fb{background:#fef3c7;border-left:3px solid #f59e0b;padding:8px 12px;font-size:13px;margin-top:8px}
.rq .stem{color:#17384f}
.expbar{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:14px 0}
.expbar button{border:0;border-radius:6px;padding:11px 20px;color:#fff;font-weight:700;font-size:14px}
@media print{.expbar,.res-top{display:none!important}body{overflow:visible}.screen{position:static}}
@media(max-width:820px){.login-wrap,.dash-grid{grid-template-columns:1fr}.cards{grid-template-columns:1fr 1fr}#qpane{padding:18px 16px 90px}#rightbar{width:84px}.seg{padding:0 6px}.tb-title{display:none}.tb-title.keep{display:flex}#passage.on{position:absolute;inset:0;width:100%;z-index:15}.c-g.l,.c-g.n,.c-g.o{grid-template-columns:repeat(3,44px)}.c-g.o{grid-template-columns:repeat(2,44px)}}

/* ---------- platform additions (multi-subject) ---------- */
#loadScreen{background:#eef0f2;display:flex!important;align-items:center;justify-content:center;flex-direction:column;gap:14px;color:#34495a;font-weight:700}
#loadScreen:not(.on){display:none!important}
.spin{width:44px;height:44px;border:4px solid #cfd8df;border-top-color:#24475b;border-radius:50%;animation:spn 1s linear infinite}@keyframes spn{to{transform:rotate(360deg)}}
#loadScreen .lerr{max-width:460px;text-align:center;font-weight:600;color:#a8253a}
#loadScreen .lbtn{background:#24475b;color:#fff;border:0;padding:9px 18px;border-radius:4px;font-weight:700}
.prev-banner{background:#f59e0b;color:#1f2937;text-align:center;font-size:12px;font-weight:800;padding:3px 8px;flex:none;letter-spacing:.3px}
.katex{direction:ltr;unicode-bidi:isolate}
.part-badge{display:inline-flex;align-items:center;gap:6px;background:var(--circle);color:#fff;font-size:12px;font-weight:800;padding:3px 12px;border-radius:14px;margin-bottom:12px;letter-spacing:.2px}
.part-badge.rtl{direction:rtl;font-family:'Noto Naskh Arabic',Tahoma,Arial}
.qgroup{background:var(--navy);color:#fff;font-size:12px;font-weight:800;padding:7px 14px;letter-spacing:.3px;position:sticky;top:0;z-index:2}
body.dark .qgroup{background:#0b1720}
.stem-ar,.ar-text{font-family:'Noto Naskh Arabic','Amiri',Tahoma,Arial;font-weight:700}
.stem.ar-only .stem-ar{border-top:0;margin-top:0;padding-top:0;font-size:calc(var(--stem) * 1.12);line-height:calc(var(--lh) + .35)}
/* bilingual question & answers: English on the left, Arabic on the right (like the official paper); stacked on phones */
.stem.bi{display:grid;grid-template-columns:1fr 1fr;column-gap:32px;direction:ltr;align-items:start}
.stem.bi .stem-ar{border-top:0;margin-top:0;padding-top:0}
.stem.bi > :not(.stem-en):not(.stem-ar){grid-column:1/-1}
.ot .o-bi{display:flex;flex-direction:column;gap:4px;direction:ltr;text-align:left}   /* answer: Arabic line on top, English line under it */
.ot .o-bi .o-ar{margin-top:0;text-align:left}
/* answer letter INSIDE the circle (no separate "a." column); picked answer = filled circle with a white letter */
#opts .opt{grid-template-columns:1fr auto 34px}
#opts .opt .l{display:none}
#opts .opt .r{width:30px;height:30px;font-size:14px;font-weight:800;color:var(--ink);line-height:1;background:#fff}
#opts .opt.sel .r{background:var(--ink);color:#fff}
#opts .opt.sel .r::after{display:none}
@media(max-width:700px){.stem.bi{grid-template-columns:1fr}.stem.bi .stem-ar{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}}
.opts.rtl{direction:rtl}.opts.rtl .opt{font-family:'Noto Naskh Arabic','Amiri',Tahoma,Arial;font-size:calc(var(--opt) * 1.12)}
.opts.rtl .opt.struck::before{left:0;right:0}
.q-img{display:block;max-width:min(100%,560px);max-height:420px;margin:14px auto 4px;border:1px solid var(--line);border-radius:4px;background:#fff;object-fit:contain}
body.magnify .stem img.q-img{transform:none;max-width:100%;max-height:none;width:min(100%,820px)}
#passage .p-title{font-weight:800;color:var(--ink);font-size:16px;margin-bottom:10px;padding-bottom:8px;border-bottom:2px solid var(--row-b)}
#passage .p-body p{margin:0 0 12px;line-height:1.75}
#passage .p-ar{direction:rtl;text-align:right;font-family:'Amiri','Noto Naskh Arabic',Tahoma;font-size:19px;line-height:2.1}
#passage .p-en{direction:ltr;text-align:left}
#passage .p-ar+.p-en,#passage .p-en+.p-ar{margin-top:14px;padding-top:12px;border-top:1px dashed var(--row-b)}
.gap{display:inline-block;min-width:64px;border-bottom:2px solid var(--ink);font-weight:800;padding:0 4px;text-align:center}
.gap.cur{background:#fff176;color:#000;border-radius:3px}
.res-top .rbtn{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.4);border-radius:4px;color:#fff;padding:6px 12px;font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.res-top .rbtn svg{width:16px;height:16px}
.save-state{font-size:12px;padding:6px 10px;border-radius:4px;margin-bottom:14px;text-align:center;font-weight:700}
.save-state.ok{background:#dff2c4;color:#2f6b12}.save-state.err{background:#fcdfe7;color:#a8253a}.save-state.pv{background:#fef3c7;color:#8a5a00}
.save-state button{margin-inline-start:10px;border:0;background:#a8253a;color:#fff;border-radius:3px;padding:3px 10px;font-weight:700}
.rq img.q-img{max-height:300px}
.ot img.o-img,.opt img.o-img{display:block;max-width:min(100%,260px);max-height:200px;border:1px solid var(--line);border-radius:4px;background:#fff;object-fit:contain;margin:2px 0}
.ot .o-txt{display:block;margin-top:4px}
.ot .o-en,.ot .o-ar{display:block}.ot .o-ar{font-family:"Noto Naskh Arabic","Segoe UI",Tahoma,sans-serif;text-align:right;margin-top:3px}
.opt.struck img.o-img{opacity:.35}
.rq .opt img.o-img{max-height:140px}
.rq .ar-only{direction:rtl;text-align:right}
.part-h{font-size:13px;color:var(--muted);font-weight:800;margin:18px 0 8px;text-transform:uppercase;letter-spacing:.4px}
[dir=rtl] .res-top .rbtn svg.flip{transform:scaleX(-1)}
/* RTL: mirror the floating buttons so they sit beside the marks bar, not on top of the passage */
[dir=rtl] #fabInfo,[dir=rtl] #fabHint{right:auto;left:98px}[dir=rtl] #fabInfo.off,[dir=rtl] #fabHint.off{left:8px}
[dir=rtl] #fabTrash{right:auto;left:14px}
[dir=rtl] #fabPass{left:auto;right:-14px;border-radius:20px 0 0 20px}

      else { if(s[i]==='$'){ inM=!inM; if(s[i+1]==='$'){ buf+='$'; i++; } } buf+=s[i]; } }

const blankTxt=v=>!String(v??'').replace(/<[^>]*>/g,'').trim();

// "English / عربي" written in ONE cell (common in uploaded files) -> split into the English and the Arabic part, so the
// answer shows as two separate lines like the question. Splits only at " / " or " | " OUTSIDE $…$ maths, and only when
// one side is Arabic and the other is not. Exams already uploaded are fixed on screen without re-uploading.
const AR_LETTER=/[؀-ۿ]/, noMath=s=>String(s).replace(/\$[^$]*\$/g,'');
function splitBi(s){ s=String(s??'');
  // drop invisible direction marks (LRM/RLM, embeddings, isolates) that editors and Claude often add around Arabic
  s = s.replace(/[\u200E\u200F\u202A-\u202E\u2066-\u2069]/g, '');
  // Arabic and English on separate LINES of one cell (new line or <br>): group the Arabic lines and the other lines
  const lines = s.split(/\s*(?:\r?\n|<br\s*\/?>)\s*/i).map(x => x.trim()).filter(Boolean);
  if (lines.length > 1) { const ar = [], en = []; lines.forEach(l => (AR_LETTER.test(noMath(l)) ? ar : en).push(l)); if (ar.length && en.length) return { en: en.join(' '), ar: ar.join(' ') }; }

  if(!AR_LETTER.test(noMath(s)) || !/[A-Za-z]{2}/.test(noMath(s))) return null;
  let inM=false;
  for(let i=0;i<s.length;i++){ const c=s[i];
    if(c==='\\'&&s[i+1]==='$'){ i++; continue; }
    if(c==='$'){ inM=!inM; continue; }
    if(!inM && /\s/.test(c) && (s[i+1]==='/'||s[i+1]==='|') && /\s/.test(s[i+2]||'')){
      const a=s.slice(0,i).trim(), b=s.slice(i+2).trim(), aAr=AR_LETTER.test(noMath(a)), bAr=AR_LETTER.test(noMath(b));
      if(a && b && aAr!==bAr) return aAr ? { en:b, ar:a } : { en:a, ar:b };
    } }
  // "عربي (English words)" or "English (عربي)": the other language in BRACKETS at the end. Only when the brackets hold real
  // words (lowercase letters): a word of 4+ letters with lowercase), so (ATP), (amu), (A) are left alone.
  { const bm = s.match(/^([\s\S]*?\S)\s*\(([^()]*)\)\s*$/);
    if (bm) { const out = bm[1].trim(), inn = bm[2].trim();
      const oAr = AR_LETTER.test(noMath(out)), iAr = AR_LETTER.test(noMath(inn)), oEn = /[A-Za-z]{3,}/.test(noMath(out)), iEn = /(?=[A-Za-z]*[a-z])[A-Za-z]{4,}/.test(noMath(inn));
      if (oAr && !oEn && iEn && !iAr) return { en: inn, ar: out };
      if (oEn && !oAr && iAr && !/[A-Za-z]{3,}/.test(noMath(inn))) { const maths = (out.match(/\$[^$]+\$/g) || []).join(' '); return { en: out, ar: maths ? maths + '، ' + inn : inn }; } } }
  return null; }
function splitCombined(){
  SOURCE_QUESTIONS.forEach(q=>{
    q.options.forEach((o,k)=>{ if(String(q.options_ar[k]||'').trim()) return; const sp=splitBi(o); if(sp){ q.options[k]=sp.en; q.options_ar[k]=sp.ar; } });
    if(!String(q.ar||'').trim()){ const sp=splitBi(q.en); if(sp){ q.en=sp.en; q.ar=sp.ar; } }
  });
}
// In ARABIC text a maths part that STARTS with a sign ("المعامل الرئيس $= 4$") is drawn left-to-right, which puts the
// sign on the far side ("= 4 المعامل الرئيس"). Move that leading sign out of the maths so it sits between the Arabic words and
// the value ("4 = المعامل الرئيس"). Only Arabic text, only a sign at the START of a $…$ part; display maths ($$…$$) untouched.
const AR_SIGN = { '=': '=', '<': '<', '>': '>', '≤': '≤', '≥': '≥', '≠': '≠', '≈': '≈', '\\le': '≤', '\\leq': '≤', '\\ge': '≥', '\\geq': '≥', '\\ne': '≠', '\\neq': '≠', '\\approx': '≈' };
function fixArMath(s) {
  s = String(s ?? '');
  if (!/[؀-ۿ]/.test(s) || s.indexOf('$') < 0) return s;
  let out = '', i = 0;
  while (i < s.length) {
    if (s[i] === '\\' && s[i + 1] === '$') { out += '\\$'; i += 2; continue; }        // escaped money sign
    if (s[i] === '$' && s[i + 1] === '$') {                                             // $$display$$: copy unchanged
      const j = s.indexOf('$$', i + 2); if (j < 0) { out += s.slice(i); break; }
      out += s.slice(i, j + 2); i = j + 2; continue;
    }
    if (s[i] === '$') {                                                                 // inline $…$
      let j = i + 1; while (j < s.length && !(s[j] === '$' && s[j - 1] !== '\\')) j++;
      if (j >= s.length) { out += s.slice(i); break; }
      const inner = s.slice(i + 1, j);
      const m = inner.match(/^\s*(\\(?:leq?|geq?|neq?|approx)(?![a-zA-Z])|=|<|>|≤|≥|≠|≈)\s*([\s\S]+)$/);
      out += m ? `${AR_SIGN[m[1]] || m[1]} $${m[2]}$` : s.slice(i, j + 1);
      i = j + 1; continue;
    }
    out += s[i++];
  }
  return out;
}
function fixArabicMath(){
  SOURCE_QUESTIONS.forEach(q=>{ q.ar=fixArMath(q.ar); q.options=q.options.map(fixArMath); q.options_ar=q.options_ar.map(fixArMath);
    if(q.feedback) q.feedback=fixArMath(q.feedback); if(q.hint) q.hint=fixArMath(q.hint);
    if(q.passage && q.passage.ar) q.passage={...q.passage, ar:fixArMath(q.passage.ar)}; });
}

const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };

document.addEventListener('keydown',e=>{
  if(!$('#examScreen').classList.contains('on')||['INPUT','TEXTAREA'].includes(e.target.tagName)||$('#mback').classList.contains('on')) return;
  const rtl=document.documentElement.dir==='rtl';
  if(e.key==='ArrowRight') $(rtl?'#btnPrev':'#btnNext').click(); else if(e.key==='ArrowLeft') $(rtl?'#btnNext':'#btnPrev').click();
  else if(/^[1-4]$/.test(e.key)) pick(+e.key-1); else if(/^[a-d]$/i.test(e.key)) pick(e.key.toLowerCase().charCodeAt(0)-97);

// passage text -> paragraphs, numbered cloze gaps "(1) _____" become highlighted gap chips
function passageHtml(txt, cls, curGap){
  return `<div class="p-body ${cls}">`+String(txt).split(/\n\s*\n|\n/).filter(p=>p.trim()).map(p=>`<p>${esc(p).replace(/\((\d+)\)\s*_{2,}/g,(m,n)=>`<span class="gap ${String(n)===curGap?'cur':''}">(${n})</span>`).replace(/_{3,}/g,'<span class="gap">&nbsp;</span>')}</p>`).join('')+`</div>`;
}
const keepHtml = s => String(s ?? '');   // teachers' content may contain KaTeX and simple HTML
// an answer = optional picture + optional text
// an answer = optional picture + English text and/or Arabic text (Option_X_AR); both languages are stacked like the question stem
const optHtml = (q,k) => { const im=(q.option_images||[])[k], en=String(q.options[k]??'').trim(), ar=String((q.options_ar||[])[k]??'').trim();
  const tx = ar && ar!==en ? (en ? `<span class="o-bi"><span class="o-ar" dir="rtl">${keepHtml(ar)}</span><span class="o-en" dir="ltr">${keepHtml(en)}</span></span>` : `<span class="o-ar" dir="rtl">${keepHtml(ar)}</span>`) : en;
  return (im?`<img class="o-img" src="${esc(im)}" alt="${String.fromCharCode(97+k)}">`:'') + (tx.trim()?(im?`<span class="o-txt">${keepHtml(tx)}</span>`:keepHtml(tx)):''); };
const optPlain = (q,k) => { const tx=[plainTxt(q.options[k]||''), plainTxt((q.options_ar||[])[k]||'')].filter(Boolean).filter((x,i,a)=>a.indexOf(x)===i).join(' / '); return tx || ((q.option_images||[])[k] ? '[picture]' : ''); };
function renderQ(){

  $('#btnSubTop').classList.toggle('on',last); $('#btnMark').classList.toggle('on',st.marked[i]);
  const hasEn=!!String(q.en||'').trim(), hasAr=!!String(q.ar||'').trim(), arOnly=hasAr&&!hasEn;
  const arPart=/[؀-ۿ]/.test(q.section_part||'');
  const img=q.image_url?`<img class="q-img" src="${esc(q.image_url)}" alt="">`:'';
  const pane=$('#qpane');
  pane.innerHTML=`${q.section_part?`<div class="part-badge ${arPart?'rtl':''}">${esc(q.section_part)}</div>`:''}
   <div class="stem ${arOnly?'ar-only':''} ${hasEn&&hasAr?'bi':''}" id="stem">${hasEn?`<div class="stem-en" dir="ltr">${keepHtml(q.en)}</div>`:''}${hasAr?`<div class="stem-ar" dir="rtl">${keepHtml(q.ar)}</div>`:''}${img}</div>
   <div class="strike-row"><button class="strike-btn ${st.smode[i]?'on':''}" id="btnStrike" title="${t('t_strike')}">S</button></div>
   <div class="opts ${st.smode[i]?'sm':''} ${arOnly?'rtl':''}" id="opts">${q.options.map((o,k)=>`<div class="opt" data-k="${k}"><span class="l">${String.fromCharCode(97+k)}.</span><span class="ot" dir="auto">${optHtml(q,k)}</span><span class="x"></span><span class="r">${String.fromCharCode(97+k)}</span></div>`).join('')}</div>
   <div class="hintbox" id="hintbox" dir="auto">${keepHtml(q.hint)}</div>`;
  if(st.hl[i]){ $('#stem').innerHTML=st.hl[i]; } else math($('#stem'));
  math($('#opts')); math($('#hintbox')); paintOpts();
  $('#btnStrike').onclick=()=>{ st.smode[i]=!st.smode[i]; $('#btnStrike').classList.toggle('on',st.smode[i]); $('#opts').classList.toggle('sm',st.smode[i]); paintOpts(); };
  $('#opts').onclick=e=>{ const o=e.target.closest('.opt'); if(!o) return; const k=+o.dataset.k;
    if(e.target.closest('.x')){ if(st.strike[i].has(k)) st.strike[i].delete(k); else { st.strike[i].add(k); if(st.answers[i]===k) st.answers[i]=null; } paintOpts(); sync(); }
    else pick(k); };

  $('#rightbar').innerHTML=`<div class="mk">${mk(q)} ${t('marks')}</div><div class="lo" dir="auto">${q.topic?esc(q.topic)+'<br><br>':''}${q.outcome_label?esc(q.outcome_label)+'<br>':''}${q.outcome_code?'<b>'+esc(q.outcome_code)+'</b>':''}</div>`;
  math($('#rightbar'));
  $('#rightbar').classList.toggle('off',!st.rightOpen); $('#fabInfo').classList.toggle('off',!st.rightOpen); $('#fabHint').classList.toggle('off',!st.rightOpen);

  const hasP=!!q.passage; $('#fabPass').style.display=hasP?'flex':'none';
  $('#passage').classList.toggle('on',hasP&&st.passOpen);
  if(hasP){
    const gap=((q.en||q.ar||'').match(/gap\s*\((\d+)\)|\((\d+)\)/i)||[]).slice(1).find(Boolean);
    const key=q.passage.id+'|'+gap;
    if($('#passage').dataset.key!==key){
      const keepScroll=$('#passage').dataset.pid===q.passage.id ? $('#passage').scrollTop : 0;
      $('#passage').innerHTML=`${q.passage.title?`<div class="p-title" dir="auto">${esc(q.passage.title)}</div>`:''}${q.passage.en?passageHtml(q.passage.en,'p-en',gap):''}${q.passage.ar?passageHtml(q.passage.ar,'p-ar',gap):''}`;
      math($('#passage')); $('#passage').dataset.key=key; $('#passage').dataset.pid=q.passage.id; $('#passage').scrollTop=keepScroll;
      const g=$('#passage .gap.cur'); if(g) g.scrollIntoView({block:'nearest'});

}
function paintOpts(){ const i=st.cur; $$('#opts .opt').forEach(o=>{ const k=+o.dataset.k, s=st.strike[i].has(k);
  o.classList.toggle('sel',st.answers[i]===k); o.classList.toggle('struck',s); o.querySelector('.x').textContent = s?t('undo'):'✕'; }); }
function pick(k){ const i=st.cur; if(k<0||k>=st.qs[i].options.length||st.strike[i].has(k)) return; st.answers[i]=k; paintOpts(); sync(); }

/* ---------- submit & save ---------- */
$('#btnSubTop').onclick=trySubmit;
function trySubmit(){
  if(C.requireSeenAll && st.seen.some((s,i)=>!s && i!==st.cur)){ toast('warning',t('seen_warn')); return; }
  if(C.requireSeenAll && !st.seen[st.cur]){ toast('warning',t('seen_warn')); return; }
  confirmDlg(st.answers.some(a=>a===null)?t('c_unans'):t('c_submit'), finish);
}
// answers keyed by ORIGINAL (unshuffled) question index; picked = ORIGINAL option index
function buildPayload(){
  const answers={};
  st.qs.forEach((q,i)=>{ const a=st.answers[i]; answers[q.oi]={ picked: a===null?null:q.omap[a], marked: !!st.marked[i], order: i }; });
  return { exam_id: EXAM.id, answers, time_spent_seconds: Math.round((st.endedAt-st.startedAt)/1000), score_gained: score().got, total_marks: TOTAL_MARKS };
}
async function saveAttempt(){
  if(PREVIEW) return;
  st.saveErr=null;
  try{ if(ME.role==='guest'){ st.saved = await API.guestSubmit(st.payload); if(st.saved&&st.saved.key) applyKey(st.saved.key); toast('success',t('guest_saved',{n:st.saved.attempt_number})); }   // visitor: saved only in their own history
       else { st.saved = await API.submitAttempt(st.payload); if(st.saved&&st.saved.key) applyKey(st.saved.key); toast('success',t('saved_ok',{n:st.saved.attempt_number})); } }
  catch(e){ st.saveErr=e.message||String(e); toast('error',t('save_err',{m:st.saveErr})); }
  showResults();
}
function finish(){
  if(st.submitted) return; st.submitted=true; st.endedAt=new Date(); clearInterval(st.timer);
  $('#calc').classList.remove('on'); document.body.classList.remove('calc-open'); $('#a11y').classList.remove('on'); closeModal();
  st.payload = buildPayload();
  showResults(); show('resultScreen'); if(PREVIEW) toast('warning',t('preview_nosave')); else saveAttempt();
}

/* ---------- results ---------- */
function score(){ let got=0,c=0; const rows=st.qs.map((q,i)=>{ const ok=st.answers[i]===q.correct; if(ok){got+=mk(q);c++;} return {q,i,ok,pk:st.answers[i]}; }); return {got,c,rows}; }
function breakdown(rows,key){ const m={}; rows.forEach(r=>{ const k=r.q[key]||'-'; m[k]=m[k]||{c:0,n:0,got:0,tot:0}; m[k].n++; m[k].tot+=mk(r.q); if(r.ok){m[k].c++; m[k].got+=mk(r.q);} }); return m; }
// Live site: students get the questions WITHOUT the answer key; the server sends it back with the saved attempt.
function applyKey(key){ if(!Array.isArray(key)) return; key.forEach((k,i)=>{ const s=SOURCE_QUESTIONS[i]; if(s&&k){ s.correct=k.correct; if(k.feedback) s.feedback=k.feedback; } });
  st.qs.forEach(q=>{ const k=key[q.oi]; if(k){ q.correct=q.omap.indexOf(k.correct); if(k.feedback) q.feedback=k.feedback; } }); }

/* ---------- accessibility ---------- */
const A={size:22,space:false,font:'def',mag:false,dark:false};
const FONTS={def:"'Nunito','Segoe UI',Tahoma,Arial,sans-serif",cal:"Calibri,'Segoe UI',Arial,sans-serif",sit:"Sitka,Georgia,serif",com:"'Comic Sans MS','Comic Sans',cursive"};
function applyA(){ const r=document.documentElement.style; r.setProperty('--stem',(A.size*.8)+'px'); r.setProperty('--opt',(A.size*.68)+'px'); r.setProperty('--font',FONTS[A.font]);
  document.body.classList.toggle('spacing',A.space); document.body.classList.toggle('magnify',A.mag); document.body.classList.toggle('dark',A.dark); }
function buildA11y(){
  const f=(k,l)=>`<label><input type="radio" name="fnt" value="${k}" ${A.font===k?'checked':''}> <span style="font-family:${FONTS[k]}">${l}</span></label>`;
  $('#a11y').innerHTML=`<h3><span>${t('a_title')}</span><button class="tbtn" id="a11yX" style="color:#143b4c">&times;</button></h3><button class="reset" id="aReset">${t('reset')}</button>
   <h4>${t('a_size')}</h4><input type="range" id="aSize" min="14" max="34" value="${A.size}"><div style="text-align:center" id="aSizeV">${A.size}</div>
   <h4>${t('a_space')}</h4><button class="sw ${A.space?'on':''}" id="aSp"></button>
   <h4>${t('a_font')}</h4>${f('def',t('f_def'))}${f('cal','Calibri')}${f('sit','Sitka')}${f('com','Comic Sans')}
   <h4>${t('a_mag')}</h4><button class="sw ${A.mag?'on':''}" id="aMag"></button>
   <h4>${t('a_theme')}</h4><div class="themes"><button class="th-l ${A.dark?'':'act'}" id="thL">&#10003;</button><button class="th-d ${A.dark?'act':''}" id="thD">A</button></div>`;
  $('#a11yX').onclick=()=>$('#a11y').classList.remove('on');
  $('#aReset').onclick=()=>{ Object.assign(A,{size:22,space:false,font:'def',mag:false,dark:false}); applyA(); buildA11y(); };
  $('#aSize').oninput=e=>{ A.size=+e.target.value; $('#aSizeV').textContent=A.size; applyA(); };
  $('#aSp').onclick=()=>{ A.space=!A.space; applyA(); buildA11y(); };
  $('#aMag').onclick=()=>{ A.mag=!A.mag; applyA(); buildA11y(); };
  $$('#a11y input[name=fnt]').forEach(r=>r.onchange=()=>{ A.font=r.value; applyA(); });
  $('#thL').onclick=()=>{ A.dark=false; applyA(); buildA11y(); }; $('#thD').onclick=()=>{ A.dark=true; applyA(); buildA11y(); };
}

/* ---------- calculator (Desmos-style scientific) ---------- */
const K={tab:'main',deg:false,rows:[],hist:[''],hi:0,ans:0,proj:false,rc:false};
$('#btnCalc').onclick=()=>{ const c=$('#calc'); const on=!c.classList.contains('on'); if(on) buildCalc(); c.classList.toggle('on',on); document.body.classList.toggle('calc-open',on); };
function evalExpr(src){
  let s=src.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/π/g,' pi ').replace(/√/g,' sqrt ').replace(/\s+of\s+/gi,'*').replace(/ans/gi,' ans ').replace(/\|([^|]*)\|/g,'abs($1)');
  const tok=[]; const re=/\s*(\d+\.?\d*|\.\d+|[a-zA-Z]+|[-+*\/^(),!%])/y; let m; re.lastIndex=0;
  while(re.lastIndex<s.length && (m=re.exec(s))) tok.push(m[1]); if(re.lastIndex<s.trimEnd().length) return NaN;
  let p=0; const pk=()=>tok[p], nx=()=>tok[p++], num=x=>x!==undefined&&/^[\d.]/.test(x), nm=x=>x!==undefined&&/^[a-zA-Z]/.test(x);
  const ang=x=>K.deg?x*Math.PI/180:x, back=x=>K.deg?x*180/Math.PI:x;
  const F={sin:x=>Math.sin(ang(x)),cos:x=>Math.cos(ang(x)),tan:x=>Math.tan(ang(x)),asin:x=>back(Math.asin(x)),acos:x=>back(Math.acos(x)),atan:x=>back(Math.atan(x)),ln:Math.log,log:Math.log10,sqrt:Math.sqrt,abs:Math.abs,floor:Math.floor,ceil:Math.ceil,exp:Math.exp,
    nthroot:(n,x)=>x<0&&n%2?-Math.pow(-x,1/n):Math.pow(x,1/n),ncr:(n,r)=>{let a=1;for(let i=1;i<=r;i++)a=a*(n-r+i)/i;return Math.round(a)},npr:(n,r)=>{let a=1;for(let i=0;i<r;i++)a*=n-i;return a}};
  const fact=n=>{ if(n<0||n%1) return NaN; let a=1; for(let i=2;i<=n;i++)a*=i; return a; };
  function expr(){ let v=term(); while(pk()==='+'||pk()==='-'){ const o=nx(),r=term(); v=o==='+'?v+r:v-r; } return v; }
  function term(){ let v=unary(); for(;;){ const x=pk(); if(x==='*'||x==='/'){nx();const r=unary();v=x==='*'?v*r:v/r;} else if(num(x)||nm(x)||x==='('){ v*=unary(); } else break; } return v; }
  function unary(){ if(pk()==='-'){nx();return -unary();} if(pk()==='+'){nx();return unary();} return pow(); }
  function pow(){ let b=post(); if(pk()==='^'){ nx(); const e=unary(); return Math.pow(b,e);} return b; }
  function post(){ let v=prim(); while(pk()==='!'||pk()==='%'){ v = nx()==='!'?fact(v):v/100; } return v; }
  function prim(){ const x=nx(); if(x===undefined) throw 0;
    if(num(x)) return parseFloat(x); if(x==='('){ const v=expr(); if(nx()!==')') throw 0; return v; }
    if(nm(x)){ const l=x.toLowerCase(); if(l==='pi') return Math.PI; if(l==='e') return Math.E; if(l==='ans') return K.ans;
      const fn=F[l]; if(!fn) throw 0; if(pk()==='('){ nx(); const a=[expr()]; while(pk()===','){nx();a.push(expr());} if(nx()!==')') throw 0; return fn(...a); } return fn(pow()); }
    throw 0; }
  try{ const v=expr(); if(p<tok.length) return NaN; return v; }catch(_){ return NaN; }
}
const fmtN=v=>{ if(!isFinite(v)) return ''; const r=parseFloat(v.toPrecision(10)); return Math.abs(r)>=1e12||(r!==0&&Math.abs(r)<1e-6)?r.toExponential(6).replace(/\.?0+e/,'e'):String(r); };
function toFrac(x){ if(!isFinite(x)||x%1===0) return null; let a=x,h1=1,h0=0,k1=0,k0=1; for(let i=0;i<20;i++){ const n=Math.floor(a); const h=n*h1+h0,k=n*k1+k0; h0=h1;h1=h;k0=k1;k1=k; if(Math.abs(x-h/k)<1e-9||k>100000) break; a=1/(a-n); if(!isFinite(a)) break; } return Math.abs(x-h1/k1)<1e-9?[h1,k1]:null; }
const fracHtml=f=>`<span class="fr"><i>${f[0]}</i><i>${f[1]}</i></span>`;
function buildCalc(){
  const c=$('#calc'); c.className='on'+(K.proj?' proj':'')+(K.rc?' rc':'');
  const keys=(arr,cls)=>arr.map(([l,ins,c2])=>`<button class="k ${c2||''}" data-ins="${ins.replace(/"/g,'&quot;')}">${l}</button>`).join('');
  const left={main:[['a²','^2'],['a<sup>b</sup>','^('],['|a|','abs('],['√','√('],['<sup>n</sup>√','nthroot('],['π','π'],['sin','sin('],['cos','cos('],['tan','tan('],['(','('],[')',')'],[',',',']],
    abc:[['a','a'],['b','b'],['c','c'],['x','x'],['y','y'],['z','z'],['θ','θ'],['=','='],['&lt;','<'],['&gt;','>'],['&le;','≤'],['&ge;','≥']],
    func:[['sin⁻¹','asin('],['cos⁻¹','acos('],['tan⁻¹','atan('],['ln','ln('],['log','log('],['e','e'],['n!','!'],['nCr','ncr('],['nPr','npr('],['⌊a⌋','floor('],['⌈a⌉','ceil('],['eˣ','exp(']]}[K.tab];
  const nums=[['7','7','num'],['8','8','num'],['9','9','num'],['4','4','num'],['5','5','num'],['6','6','num'],['1','1','num'],['2','2','num'],['3','3','num'],['0','0','num'],['.','.','num'],['ans','ans']];
  const ops=[['÷','÷','op'],['⌫','BS','num'],['×','×','op'],['%','%'],['−','−','op'],['a/b','/'],['+','+','op'],['↵','ENTER','enter']];
  c.innerHTML=`<div class="c-rows" id="cRows"></div>
   <div class="c-in"><input id="cIn" autocomplete="off" spellcheck="false"><span class="c-res" id="cLive"></span></div>
   <div class="c-tabs"><span class="t ${K.tab==='main'?'on':''}" data-tab="main">${t('c_main')}</span><span class="t ${K.tab==='abc'?'on':''}" data-tab="abc">${t('c_abc')}</span><span class="t ${K.tab==='func'?'on':''}" data-tab="func">${t('c_func')}</span>
    <button class="deg" id="cDeg">${K.deg?'DEG':'RAD'}</button><span class="sp"></span><button class="ic" id="cUndo">&#8630;</button><button class="ic" id="cRedo">&#8631;</button><button class="ic" id="cClear">${t('c_clear')}</button><button class="ic" id="cWr">&#128295;</button><button class="ic" id="cX">&times;</button></div>
   <div class="c-pad"><div class="c-g l">${keys(left)}</div><div class="c-g n">${keys(nums)}</div><div class="c-g o">${keys(ops)}</div></div>
   <div class="wrench" id="cWrench"><button class="pj" id="cPj">${t('c_proj')}</button><div>${t('c_braille')}</div><div class="seg3"><button class="on">${t('c_off')}</button><button data-br>Nemeth</button><button data-br>UEB</button></div><label><input type="checkbox" id="cRc" ${K.rc?'checked':''}> ${t('c_rc')}</label></div>`;
  const inp=$('#cIn'); inp.value=K.hist[K.hi]||'';
  const live=()=>{ const v=inp.value.trim()?evalExpr(inp.value):NaN; $('#cLive').textContent=isNaN(v)?'':'= '+fmtN(v); };
  const push=()=>{ if(K.hist[K.hi]!==inp.value){ K.hist=K.hist.slice(0,K.hi+1); K.hist.push(inp.value); K.hi++; } live(); };
  const enter=()=>{ const e=inp.value.trim(); if(!e) return; const v=evalExpr(e); if(isNaN(v)) return; K.rows.push({e,v,f:false}); K.ans=v; inp.value=''; K.hist=['']; K.hi=0; rows(); live(); };
  const rows=()=>{ const r=$('#cRows'); r.innerHTML=(K.rows.length?'':`<div class="c-hint">${t('c_hint')}<br>&#8631;</div>`)+K.rows.map((x,i)=>{ const f=x.f?toFrac(x.v):null; return `<div class="c-row"><span>${x.e}</span><span class="rs">= ${f?fracHtml(f):fmtN(x.v)}<button class="fbtn" data-f="${i}" title="${t('c_frac')}">&#9643;/&#9643;</button></span></div>`; }).join(''); r.scrollTop=r.scrollHeight;
    $$('#cRows [data-f]').forEach(b=>b.onclick=()=>{ K.rows[+b.dataset.f].f=!K.rows[+b.dataset.f].f; rows(); }); };
  rows(); live();
  inp.oninput=push; inp.onkeydown=e=>{ if(e.key==='Enter') enter(); };
  $$('#calc .k').forEach(b=>b.onmousedown=e=>e.preventDefault());
  $$('#calc .k').forEach(b=>b.onclick=()=>{ const d=b.dataset.ins; if(d==='ENTER'){enter();return;}
    if(d==='BS'){ const p=inp.selectionStart; if(p>0){ inp.value=inp.value.slice(0,p-1)+inp.value.slice(inp.selectionEnd); inp.setSelectionRange(p-1,p-1);} }
    else { const p=inp.selectionStart; inp.value=inp.value.slice(0,p)+d+inp.value.slice(inp.selectionEnd); const q=p+d.length; inp.setSelectionRange(q,q); }
    inp.focus(); push(); });
  $$('#calc [data-tab]').forEach(x=>x.onclick=()=>{ K.hist[K.hi]=inp.value; K.tab=x.dataset.tab; buildCalc(); });
  $('#cDeg').onclick=()=>{ K.deg=!K.deg; $('#cDeg').textContent=K.deg?'DEG':'RAD'; live(); };
  $('#cUndo').onclick=()=>{ if(K.hi>0){K.hi--;inp.value=K.hist[K.hi];live();} }; $('#cRedo').onclick=()=>{ if(K.hi<K.hist.length-1){K.hi++;inp.value=K.hist[K.hi];live();} };
  $('#cClear').onclick=()=>{ K.rows=[]; K.hist=['']; K.hi=0; inp.value=''; rows(); live(); };
  $('#cX').onclick=()=>$('#btnCalc').click();
  $('#cWr').onclick=()=>$('#cWrench').classList.toggle('on');
  $('#cPj').onclick=()=>{ K.proj=!K.proj; c.classList.toggle('proj',K.proj); };
  $('#cRc').onchange=e=>{ K.rc=e.target.checked; c.classList.toggle('rc',K.rc); };
  $$('#calc [data-br]').forEach(b=>b.onclick=()=>toast('warning',t('braille_na'),t('error')));
}

/* ---------- init ---------- */
boot();
</script>
